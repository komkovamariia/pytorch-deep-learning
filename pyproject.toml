[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-deep-learning-projects"
version = "0.1.0"
description = "Reproducible PyTorch experiments with inspected notebook outputs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2,<3", "torchvision>=0.17,<1", "numpy>=1.26",
    "pandas>=2", "scipy>=1.11", "scikit-learn>=1.4", "matplotlib>=3.8",
    "h5py>=3.10", "scikit-image>=0.22", "opencv-python-headless>=4.9", "gdown>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "jupyterlab>=4", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
